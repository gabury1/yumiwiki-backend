spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
      active: dev
  datasource:
    url: jdbc:sqlite:./database/${SQLITE_DB_FILE_NAME}
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

# GitHub 저장소 설정
github:
  token: ${GITHUB_TOKEN:}
  repository:
    owner: ${GITHUB_REPO_OWNER:}
    name: ${GITHUB_REPO_NAME:}
